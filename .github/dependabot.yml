version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the SHA and the
  # version comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Lint/analysis tools pinned via `tool` directives. Bumps here can change
  # what the linters report, so review the CI result, not just the diff.
  - package-ecosystem: gomod
    directory: /internal/tools
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]

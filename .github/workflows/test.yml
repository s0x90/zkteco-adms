name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The installed Go must satisfy go.mod on its own. Without this, bumping the go
# directive past the version installed below would silently download and build
# with a different toolchain than the one CI reports.
env:
  GOTOOLCHAIN: local

# Cancel superseded runs on PR branches only. On master every merge shares the
# same ref, so cancelling would drop earlier merges' results and coverage uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: make test COVERPROFILE=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
